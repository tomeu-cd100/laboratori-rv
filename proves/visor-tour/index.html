<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor de tour 360</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="tour.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #barra {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: rgba(0, 0, 0, .7); color: #fff; padding: 8px 14px; font-size: 16px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    #barra b { font-weight: 600; }
    #coords { font-family: ui-monospace, monospace; color: #ffe066; }
  </style>
</head>
<body>
  <div id="barra">
    <span id="nom-tour"></span> · <b id="nom-escena"></b>
    <span id="coords" hidden></span>
  </div>

  <a-scene renderer="colorManagement: true" xr-mode-ui="enabled: true">
    <a-sky id="cel" radius="100"></a-sky>
    <a-entity id="punts"></a-entity>

    <!-- Ordinador / Chromebook / mòbil: clic o toc amb el ratolí o el dit -->
    <a-entity camera look-controls="reverseMouseDrag: true" wasd-controls="enabled: false"
              position="0 1.6 0"
              cursor="rayOrigin: mouse" raycaster="objects: .clicable"></a-entity>

    <!-- Quest: raig làser des dels comandaments (gallet = clic) -->
    <a-entity laser-controls="hand: right" raycaster="objects: .clicable; far: 200"></a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clicable; far: 200"></a-entity>
  </a-scene>

<script>
(function () {
  const T = window.TOUR;
  const editor = new URLSearchParams(location.search).has("editor");
  const RADI = 8;           // distància (m) on es pinten els punts
  const ALCADA = 1.6;       // alçada dels ulls

  const cel = document.getElementById("cel");
  const contenidor = document.getElementById("punts");
  document.getElementById("nom-tour").textContent = T.titol;

  // yaw/pitch (graus) → posició sobre una esfera centrada als ulls
  function posicio(yaw, pitch, r) {
    const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
    return {
      x: r * Math.sin(y) * Math.cos(p),
      y: ALCADA + r * Math.sin(p),
      z: -r * Math.cos(y) * Math.cos(p)
    };
  }

  // Text dibuixat en un canvas: suporta accents i ç amb les fonts del sistema
  let comptador = 0;
  function canvasText(text, fons) {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    const mida = 48;
    ctx.font = `600 ${mida}px system-ui, sans-serif`;
    const linies = text.split("\n");
    const ample = Math.max(...linies.map(l => ctx.measureText(l).width)) + 48;
    c.width = Math.ceil(ample);
    c.height = linies.length * mida * 1.3 + 32;
    ctx.fillStyle = fons;
    ctx.beginPath(); ctx.roundRect(0, 0, c.width, c.height, 24); ctx.fill();
    ctx.font = `600 ${mida}px system-ui, sans-serif`;
    ctx.fillStyle = "#fff"; ctx.textBaseline = "top";
    linies.forEach((l, i) => ctx.fillText(l, 24, 16 + i * mida * 1.3));
    c.id = "txt" + (comptador++);
    c.style.display = "none";
    document.body.appendChild(c);
    return c;
  }

  function placaText(text, fons, yaw, pitch) {
    const c = canvasText(text, fons);
    const alt = 0.5 * c.height / 80;           // ~0,5 m per línia
    const el = document.createElement("a-plane");
    el.setAttribute("width", alt * c.width / c.height);
    el.setAttribute("height", alt);
    el.setAttribute("material", { src: "#" + c.id, transparent: true, shader: "flat" });
    const p = posicio(yaw, pitch, RADI);
    el.setAttribute("position", p);
    el.addEventListener("loaded", () => el.object3D.lookAt(0, ALCADA, 0));
    return el;
  }

  function carregaEscena(id) {
    const e = T.escenes[id];
    if (!e) { console.error("Escena inexistent:", id); return; }
    cel.setAttribute("src", e.imatge);
    cel.setAttribute("rotation", { x: 0, y: -90 + (e.gir || 0), z: 0 });
    document.getElementById("nom-escena").textContent = e.titol;
    contenidor.innerHTML = "";
    document.querySelectorAll("canvas[id^=txt]").forEach(c => c.remove());

    (e.punts || []).forEach(pt => {
      const pl = placaText(pt.etiqueta || "→", "rgba(20,110,60,.9)", pt.yaw, pt.pitch);
      pl.classList.add("clicable");
      pl.addEventListener("click", () => carregaEscena(pt.cap));
      contenidor.appendChild(pl);
    });

    (e.info || []).forEach(inf => {
      const icona = placaText(" i ", "rgba(30,80,200,.95)", inf.yaw, inf.pitch);
      const text = placaText(inf.text, "rgba(0,0,0,.85)", inf.yaw, inf.pitch - 8);
      text.setAttribute("visible", false);
      icona.classList.add("clicable");
      icona.addEventListener("click", () =>
        text.setAttribute("visible", !text.getAttribute("visible")));
      contenidor.appendChild(icona);
      contenidor.appendChild(text);
    });
  }

  // Mode editor: clic al cel → yaw/pitch per copiar a tour.js
  if (editor) {
    const coords = document.getElementById("coords");
    coords.hidden = false;
    coords.textContent = "Mode editor: fes clic on vols un punt";
    cel.classList.add("clicable");
    cel.addEventListener("click", ev => {
      const pt = ev.detail.intersection && ev.detail.intersection.point;
      if (!pt) return;
      const dx = pt.x, dy = pt.y - ALCADA, dz = pt.z;
      const yaw = Math.round(THREE.MathUtils.radToDeg(Math.atan2(dx, -dz)));
      const pitch = Math.round(THREE.MathUtils.radToDeg(Math.atan2(dy, Math.hypot(dx, dz))));
      coords.textContent = `yaw: ${yaw}, pitch: ${pitch}`;
      console.log(`{ yaw: ${yaw}, pitch: ${pitch} }`);
    });
  }

  const escena = document.querySelector("a-scene");
  const arrenca = () => carregaEscena(new URLSearchParams(location.search).get("escena") || T.inici);
  escena.hasLoaded ? arrenca() : escena.addEventListener("loaded", arrenca);
})();
</script>
</body>
</html>
